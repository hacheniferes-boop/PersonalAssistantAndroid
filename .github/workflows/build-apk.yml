name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o PersonalAssistantAndroid_source_v1_2.zip -d source

      - name: Fix Java and Kotlin versions
        run: |
          cd source/PersonalAssistantAndroid
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }""",
              1
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd source/PersonalAssistantAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-assistant-apk
          path: source/PersonalAssistantAndroid/app/build/outputs/apk/debug/app-debug.apk
